<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta
      name="description"
      content="App History remembers the apps this app previously detected on your device. Your app history stays on this device."
    />
    <title>App History — Remember the apps you've used.</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="app-frame">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">AH</span>
          <span class="brand-text">
            <strong>App History</strong>
            <small>Remember the apps you've used.</small>
          </span>
        </div>
        <button
          class="icon-btn"
          type="button"
          id="themeToggle"
          aria-label="Switch between light and dark theme"
          title="Switch theme"
        ></button>
      </header>

      <div id="statusBanner" class="banner hidden" role="status"></div>

      <main id="view" class="view" tabindex="-1"></main>

      <nav class="bottom-nav" id="bottomNav" aria-label="Main navigation">
        <a class="nav-item" href="#/" data-nav="home">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5" /><path d="M5 9.5V21h14V9.5" /></svg>
          <span>Home</span>
        </a>
        <a class="nav-item" href="#/installed" data-nav="installed">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2" /><rect x="14" y="3" width="7" height="7" rx="2" /><rect x="3" y="14" width="7" height="7" rx="2" /><rect x="14" y="14" width="7" height="7" rx="2" /></svg>
          <span>Installed</span>
        </a>
        <a class="nav-item" href="#/uninstalled" data-nav="uninstalled">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16" /><path d="M6 7v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7" /><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2" /><path d="M10 11v6M14 11v6" /></svg>
          <span>Uninstalled</span>
        </a>
        <a class="nav-item" href="#/history" data-nav="history">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3.5 2" /></svg>
          <span>History</span>
        </a>
        <a class="nav-item" href="#/settings" data-nav="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" /></svg>
          <span>Settings</span>
        </a>
      </nav>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="modalRoot"></div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
